{n:"Pos 7: Gerbang Garis Finis",lv:"Final · ⏱ 20 detik",m:7,t:20,ic:"🏁",steps:[

var XY=[[40.8,34.2],[55.7,34.2],[71.6,39],[78,61.3],[68.9,80.1],[48.8,76],[29.6,62]];
var MAXB=0;POS.forEach(function(p){p.steps.forEach(function(s){MAXB+=s.k==="quiz"?s.q.length*100*p.m:s.k==="write"?200*p.m:(s.k==="match"||s.k==="order")?300*p.m:0})});
var S={name:"",pos:0,si:0,score:0,base:0,done:[],stars:[],tm:null,left:0,ans:false};
var app=document.getElementById("app");
function saveRank(){try{var r=getRank();r.push({n:S.name+(S.kelas?" ("+S.kelas+")":""),s:S.score,d:new Date().toLocaleDateString("id-ID")});r.sort(function(a,b){return b.s-a.s});localStorage.setItem("jcp_rank",JSON.stringify(r.slice(0,10)))}catch(e){}}
function home(){clearInterval(S.tm);home3()}
function dev(){clearInterval(S.tm);dev2()}
function start(){var v=document.getElementById("nm").value.trim();if(!v){document.getElementById("nm").focus();return}
S={name:v,kelas:document.getElementById("kl").value.trim(),pos:0,si:0,score:0,base:0,done:[],stars:[],tm:null,left:0,ans:false};
app.innerHTML='<div class="card hero"><div class="big">✉️🗺️</div><h2>Briefing Misi Rahasia</h2><p>Jurnalis Cilik! Tugasmu menemukan tokoh perumus Pancasila, memahami gagasan mereka, dan menyusun laporan yang benar. Ada tujuh pos yang harus kamu taklukkan. Makin jauh perjalananmu, makin sulit tantangannya!</p><button onclick="map()">TERIMA MISI</button></div>'}
function map(){clearInterval(S.tm);var c=S.done.length,all=c>=POS.length,p=POS[c],h='<div class="top card" style="margin:0 0 8px;padding:8px 12px"><span>🧒 '+esc(S.name)+'</span><span>⭐ '+S.score+'</span></div><div class="mapw">';
XY.forEach(function(x,i){var d=i<c,u=i===c;h+='<button class="hs'+(d?' dn':u?' cur':'')+'" style="left:'+x[0]+'%;top:'+x[1]+'%" onclick="hot('+i+')" aria-label="Pos '+(i+1)+'">'+(d?"✓":u?(i+1):"🔒")+'</button>'});
h+='<div class="who">🧒 '+esc(S.name)+'</div></div><div class="card">';
if(all)h+='<div class="hero"><h2>🎉 Semua pos selesai</h2><p class="mut">Ketuk pos bertanda ✓ untuk mengulang sebagai ulasan.</p></div><div class="row"><button onclick="galeri()">🖼️ Galeri</button><button class="alt" onclick="finish()">🏆 Hasil</button></div>';
else h+='<div class="pos" style="margin:0 0 8px"><div class="n">'+p.ic+'</div><div class="t"><b>'+p.n+'</b><br><span class="tag">'+p.lv+'</span> <span class="mut">skor ×'+p.m+'</span></div></div><div class="row"><button onclick="openPos('+c+',0)">▶ Masuk Pos '+(c+1)+'</button></div><p class="mut" style="text-align:center;margin:8px 0 0">Selesai: '+c+'/'+POS.length+(c?' · '+S.stars.map(function(s){return "⭐".repeat(s)}).join(" "):"")+'</p>';
app.innerHTML=h+'</div>'}
function hot(i){if(i<S.done.length)openPos(i,1);else if(i===S.done.length)openPos(i,0);else{var w=document.querySelector(".who");if(w)w.textContent="Pos terkunci 🔒 Selesaikan pos sebelumnya dulu"}}
function openPos(i,rev){S.pos=i;S.si=0;S.qw=0;S.qn=0;S.mis=0;S.rev=!!rev;S.snap=[S.score,S.base];step()}
function add(v,b){if(S.rev)return;S.score+=v;if(b)S.base+=v}
function hdr(){var p=POS[S.pos];return '<div class="top"><span>'+p.ic+' '+p.n+(S.rev?' (ulasan)':'')+'</span><span>⭐ '+S.score+'</span></div><div class="bar"><i style="width:'+(S.si/p.steps.length*100)+'%"></i></div>'}
function step(){clearInterval(S.tm);S.att=0;S.mo=null;S.sel=[];S.pool=null;S.ch=[];var st=POS[S.pos].steps[S.si];if(!st)return endPos();
if(st.k==="info")return rInfo(st);
if(st.k==="quiz"){S.cur=st.q.map(function(q){var o=shuf(q.o);return{t:q.t,o:o.map(function(k){return q.o[k]}),a:o.indexOf(q.a),e:q.e,img:q.img}});S.qi=0;return ask()}
if(st.k==="match")return rMatch(st);if(st.k==="order")return rOrder(st);rWrite(st)}
function rInfo(st){var h=hdr()+'<div class="card"><h2>'+st.h+'</h2><p>'+st.p+'</p>';
st.c.forEach(function(c){h+='<button class="opt" onclick="openDoc(this)">'+face(c.h)+'<b>'+c.h.replace(/^[^A-Za-z]+/,"")+'</b><div class="db" hidden>'+c.b+'</div></button>'});
app.innerHTML=h+'<div class="row"><button id="nx" disabled onclick="S.si++;step()">Lanjut ➜</button></div><p class="mut" style="text-align:center">Klik semua dokumen untuk membukanya.</p></div>'}
function openDoc(b){b.querySelector(".db").hidden=false;b.classList.add("ok");b.dataset.o=1;if(document.querySelectorAll(".opt[data-o]").length===document.querySelectorAll(".opt").length)document.getElementById("nx").disabled=false}
function ask(){var p=POS[S.pos],q=S.cur[S.qi],st=p.steps[S.si];S.ans=false;
var h=hdr()+'<div class="card"><span class="tag">'+p.lv+'</span> <span class="mut">'+esc(st.h)+' · Soal '+(S.qi+1)+'/'+S.cur.length+(p.t?' · ⏱ <b id="tm">'+p.t+'</b>':'')+'</span><h2>'+esc(q.t)+'</h2>'+(q.img?'<div style="text-align:center"><img class="ph big2" src="'+PH[q.img]+'" alt="Foto tokoh"></div>':'');
q.o.forEach(function(o,i){h+='<button class="opt" onclick="pick('+i+')">'+esc(o)+'</button>'});
app.innerHTML=h+'<div id="fb"></div></div>';
if(p.t){S.left=p.t;S.tm=setInterval(function(){S.left--;var e=document.getElementById("tm");if(e)e.textContent=S.left;if(S.left<=0){clearInterval(S.tm);pick(-1)}},1000)}}
function pick(i){if(S.ans)return;S.ans=true;clearInterval(S.tm);var p=POS[S.pos],q=S.cur[S.qi],ok=i===q.a,g=0;
document.querySelectorAll(".opt").forEach(function(x,k){x.disabled=true;if(k===q.a)x.classList.add("ok");else if(k===i)x.classList.add("bad")});
S.qn++;if(ok){g=p.m*100;add(g,true);var b=p.t?S.left*p.m:0;add(b,false);g+=b}else{S.qw++;S.mis++}
var last=S.qi===S.cur.length-1;
document.getElementById("fb").innerHTML='<div class="news"><b>'+(ok?"✅ Benar! +"+(S.rev?0:g)+" poin":(i<0?"⏰ Waktu habis!":"❌ Belum tepat"))+'</b><br>📰 '+esc(q.e)+'</div><div class="row"><button onclick="nq()">'+(last?"Lanjut ➜":"Soal berikutnya ➜")+'</button></div>'}
function nq(){if(S.qi<S.cur.length-1){S.qi++;ask()}else{S.si++;step()}}
function okCard(t){var g=Math.max(100,300-100*S.att)*POS[S.pos].m;add(g,true);app.innerHTML=hdr()+'<div class="card hero"><div class="big">🎯</div><h2>'+t+'</h2><p>'+(S.rev?"":"+"+g+" poin")+'</p><button onclick="S.si++;step()">Lanjut ➜</button></div>'}
function rMatch(st,bad){if(!S.mo)S.mo=shuf(st.c);var h=hdr()+'<div class="card"><h2>'+st.h+'</h2><p>'+st.p+'</p>';
st.n.forEach(function(n,i){h+='<div'+(bad&&bad[i]?' class="news" style="border-color:var(--bad)"':'')+'><b>'+face(n)+n+'</b><select class="sel" id="s'+i+'"><option value="">— pilih petunjuk —</option>'+S.mo.map(function(k){return '<option value="'+k+'"'+(String(S.sel[i])===String(k)?' selected':'')+'>'+st.c[k]+'</option>'}).join("")+'</select></div>'});
app.innerHTML=h+'<div id="fb"></div><div class="row"><button onclick="chkMatch()">Periksa ✔</button></div></div>'}
function chkMatch(){var st=POS[S.pos].steps[S.si],bad=[],ok=true;S.sel=[];st.n.forEach(function(n,i){var v=document.getElementById("s"+i).value;S.sel[i]=v;if(v!==String(i)){ok=false;bad[i]=1}});
if(ok)return okCard("Semua pasangan benar!");S.att++;S.mis++;rMatch(st,bad);document.getElementById("fb").innerHTML='<div class="news"><b>❌ Ada yang belum tepat</b><br>Periksa lagi petunjuknya, lalu coba kembali.</div>'}
function rOrder(st,msg){if(!S.pool){S.pool=shuf(st.items);S.ch=[]}
var h=hdr()+'<div class="card"><h2>'+st.h+'</h2><p>'+st.p+'</p><b>Urutanmu:</b>';
if(!S.ch.length)h+='<p class="mut">Belum ada. Ketuk peristiwa di bawah.</p>';
S.ch.forEach(function(k,i){h+='<div class="pos"><div class="n">'+(i+1)+'.</div><div class="t">'+esc(st.items[k])+'</div></div>'});
h+='<b>Peristiwa:</b>';S.pool.forEach(function(k){if(S.ch.indexOf(k)<0)h+='<button class="opt" onclick="pickO('+k+')">'+esc(st.items[k])+'</button>'});
app.innerHTML=h+'<div id="fb">'+(msg||"")+'</div><div class="row"><button class="alt" onclick="S.ch=[];rOrder(POS[S.pos].steps[S.si])">↺ Ulangi</button>'+(S.ch.length===st.items.length?'<button onclick="chkOrder()">Periksa ✔</button>':'')+'</div></div>'}
function pickO(k){S.ch.push(k);rOrder(POS[S.pos].steps[S.si])}
function chkOrder(){var st=POS[S.pos].steps[S.si],ok=S.ch.every(function(k,i){return k===i});if(ok)return okCard("Urutan tepat!");S.att++;S.mis++;S.ch=[];rOrder(st,'<div class="news"><b>❌ Urutan belum tepat.</b> Coba lagi!</div>')}
function rWrite(st){var h=hdr()+'<div class="card"><h2>'+st.h+'</h2><p>'+st.p+'</p><p class="mut"><b>Kerangka:</b> '+st.f+'</p><textarea class="sel" id="wr" rows="5" placeholder="Tulis beritamu di sini…"></textarea><b>Rubrik penilaian mandiri:</b>';
st.r.forEach(function(r){h+='<label style="display:block;margin:6px 0"><input type="checkbox" class="rb" style="width:auto;margin:0 8px 0 0">'+r+'</label>'});
app.innerHTML=h+'<div id="fb"></div><div class="row"><button onclick="doWrite()">Kirim laporan ➜</button></div><p class="mut" style="text-align:center">Jawaban terbuka dapat diperiksa guru.</p></div>'}
function doWrite(){if(document.getElementById("wr").value.trim().length<30){document.getElementById("fb").innerHTML='<div class="news">✍️ Tulis beritamu minimal beberapa kalimat dulu ya.</div>';return}
add(document.querySelectorAll(".rb:checked").length*50*POS[S.pos].m,true);S.si++;step()}
function endPos(){var p=POS[S.pos],fail=S.qn&&S.qw*3>S.qn;
if(fail){if(!S.rev){S.score=S.snap[0];S.base=S.snap[1]}app.innerHTML='<div class="card hero"><div class="big">🔁</div><h2>Hampir!</h2><p>Kamu perlu minimal 2 dari 3 soal benar. Baca arsipnya lagi dan coba lagi.</p><div class="row"><button onclick="openPos('+S.pos+','+(S.rev?1:0)+')">Coba lagi</button><button class="alt" onclick="map()">Peta</button></div></div>';return}
var s=S.mis===0?3:S.mis<=2?2:1;
if(S.rev){app.innerHTML='<div class="card hero"><div class="big">'+"⭐".repeat(s)+'</div><h2>Ulasan selesai</h2><button onclick="map()">Ke peta ➜</button></div>';return}
S.done.push(1);S.stars.push(s);var b=s===3?p.m*50:0;add(b,false);var last=S.done.length===POS.length;
app.innerHTML='<div class="card hero"><div class="big">'+"⭐".repeat(s)+'</div><h2>Pos selesai!</h2><p>'+(b?"Bonus sempurna +"+b+" poin":"Terus semangat!")+'</p><button onclick="'+(last?"finish()":"map()")+'">'+(last?"Gerbang Finis ➜":"Ke peta ➜")+'</button></div>'}
function finish(){if(!S.saved){S.saved=1;saveRank()}var pc=Math.min(100,Math.round(S.base/MAXB*100)),g=pc>=90?"Jurnalis Ahli Sejarah 🏆":pc>=75?"Reporter Andal 🥇":pc>=60?"Detektif Pemula 🥈":"Calon Jurnalis 🥉 — berlatih kembali";
app.innerHTML='<div class="card hero"><div class="big">🏆🎉</div><h1>Misi Selesai!</h1><p>Kamu telah menjadi Jurnalis Cilik Penjaga Pancasila.</p><div class="big">'+S.score+'</div><p>Ketepatan: <b>'+pc+'%</b><br>Gelar: <b>'+g+'</b></p><div class="row"><button onclick="again()">🔁 Ulangi Misi</button><button onclick="refl()">✔ Selesai</button><button class="alt" onclick="rank()">🏅 Ranking</button></div></div>'}
function again(){S.score=0;S.base=0;S.done=[];S.stars=[];S.saved=0;map()}
function refl(){var qs=["Fakta apa yang paling kamu ingat?","Tokoh mana yang ingin kamu pelajari lebih lanjut?","Apa yang kamu lakukan jika menemukan informasi sejarah yang belum jelas?"],h='<div class="card"><h2>📝 Refleksi Jurnalis</h2><p>Pilih satu pertanyaan, lalu tulis alasanmu.</p>';
qs.forEach(function(q,i){h+='<label style="display:block;margin:6px 0"><input type="radio" name="rq" style="width:auto;margin:0 8px 0 0"'+(i?'':' checked')+'>'+q+'</label>'});
app.innerHTML=h+'<textarea class="sel" rows="4" placeholder="Tulis refleksimu…"></textarea><div class="row"><button onclick="galeri()">Lanjut ke Galeri ➜</button></div></div>'}
function galeri(){var t=[["Mohammad Yamin","29 Mei 1945 · menyampaikan gagasan dasar negara"],["Soepomo","31 Mei 1945 · menyampaikan gagasan, antara lain persatuan"],["Soekarno","1 Juni 1945 · berpidato dan memperkenalkan nama Pancasila"]],h='<div class="card"><h2>🖼️ Galeri Berita Sejarah</h2>';
t.forEach(function(x){h+='<div class="pos"><div class="n">'+face(x[0])+'</div><div class="t"><b>'+x[0]+'</b><br>'+x[1]+'</div></div>'});
app.innerHTML=h+'<h3>⏳ Garis Waktu</h3><div class="news">29 Mei–1 Juni 1945: sidang pertama BPUPKI<br>22 Juni 1945: Piagam Jakarta<br>18 Agustus 1945: PPKI menetapkan UUD 1945</div><p><b>💬 Pesan persatuan:</b> perumusan dasar negara melibatkan pemikiran dan pembahasan bersama.</p><div class="row"><button onclick="map()">🗺️ Kembali ke Peta</button><button class="alt" onclick="home()">Akhiri Petualangan</button></div></div>'}
function rank(){var r=getRank(),h='<div class="card"><h2>🏅 Ranking Jurnalis Cilik</h2>';
if(!r.length)h+='<p class="mut">Belum ada pemain. Jadilah yang pertama!</p>';else{h+='<table><tr><th>#</th><th>Nama</th><th>Skor</th><th>Tanggal</th></tr>';r.forEach(function(x,i){h+='<tr><td>'+(["🥇","🥈","🥉"][i]||i+1)+'</td><td>'+esc(x.n)+'</td><td><b>'+x.s+'</b></td><td class="mut">'+esc(x.d)+'</td></tr>'});h+='</table>'}
app.innerHTML=h+'<p class="mut">Ranking tersimpan di perangkat ini.</p><div class="row"><button onclick="home()">⬅ Beranda</button></div></div>'}

function dev2(){app.innerHTML=`<div class='dev'><div class='sp'>✨</div><div class='av'><img src='${PH.efi}' alt='Efi Yuliawati'></div><div style='font-size:12px;letter-spacing:.2em;font-weight:700'>PENGEMBANG GAME</div><div class='nm'>Efi Yuliawati</div><div><span class='badge'>🏫 Kepala SDN Gegunung Kulon</span><span class='badge'>📍 Rembang, Jawa Tengah</span><span class='badge'>🏅 Duta Teknologi Jawa Tengah</span></div><div class='quote'>Semangat petualangan ini: “Berani Mencatat, Berani Berkarya.” Belajar sejarah Pancasila jadi seru bagi jurnalis cilik.</div><div style='font-weight:800;letter-spacing:.12em;font-size:13px;margin-top:6px'>HUBUNGI &amp; IKUTI</div><a class='ct c1' href='mailto:efiyuliawati31@program.sd.belajar.id'><i>✉️</i><span>Email<small>efiyuliawati31@program.sd.belajar.id</small></span></a><a class='ct c2' href='https://www.instagram.com/efi_yuliawati' target='_blank' rel='noopener'><i>📸</i><span>Instagram<small>efi_yuliawati</small></span></a><a class='ct c3' href='https://www.tiktok.com/@efiyuliawati' target='_blank' rel='noopener'><i>🎵</i><span>TikTok<small>efiyuliawati</small></span></a><div class='ct c4'><i>👍</i><span>Facebook<small>efi yuliawati</small></span></div><div class='row'><button class='gbtn go' onclick='home()'>🏠 Kembali ke Beranda</button></div></div>`}
function showDev(){if(document.getElementById('pop'))return;var d=document.createElement('div');d.id='pop';d.onclick=function(e){if(e.target===d)closeDev()};d.innerHTML=`<div class='dvc' role='dialog' aria-label='Pengembang'><button class='x' onclick='closeDev()' aria-label='Tutup'>✕</button><div class='av' style='width:96px;height:96px;margin-bottom:8px'><img src='${PH.efi}' alt='Efi Yuliawati'></div><div style='font-size:13px;letter-spacing:.16em;font-weight:700'>DIKEMBANGKAN OLEH</div><div class='nm'>Efi Yuliawati</div><div style='font-weight:700'>Kepala SDN Gegunung Kulon</div><div>Rembang, Jawa Tengah</div><div style='margin:10px 0;display:inline-block;padding:4px 14px;border-radius:99px;background:rgba(255,215,94,.9);color:#3a200c;text-shadow:none;font-weight:800'>🏅 Duta Teknologi Jawa Tengah</div><div class='row'><button class='wbtn wood' onclick='closeDev()'>Mari Mulai ▶</button><button class='wbtn' style='background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.6)' onclick='closeDev();dev()'>Kontak</button></div></div>`;document.body.appendChild(d)}
function closeDev(){var d=document.getElementById('pop');if(d){d.classList.add('out');setTimeout(function(){d.remove()},250)}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDev()});
new MutationObserver(function(){document.getElementById('nav').style.display=document.querySelector('.hm')?'none':'flex';window.scrollTo(0,0)}).observe(app,{childList:true});
home();setTimeout(showDev,700);
